name: Refresh registry data

# Checks CarbonPlan and Berkeley once a day. If either has new data, it rebuilds site/data.js and
# site/portfolio.js and saves a commit, which then redeploys the site. If nothing changed, it does nothing.
# If a rebuild fails its checks, the old files are kept and this job shows as failed.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for new data and rebuild
        run: node scripts/refresh-data.mjs

      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain site scripts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site scripts
            git commit -m "Refresh registry data"
            git push
          else
            echo "No changes to save."
          fi
